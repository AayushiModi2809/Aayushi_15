<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 25px;
        }

        nav {
            background-color: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .content {
            padding: 50px;
        }

        .box {
            background-color: white;
            width: 300px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ccc;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e40af;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my simple website</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">

        <div class="box">
            <h2>About Us</h2>
            <p>
                This is a simple website created using
                HTML and CSS.
            </p>
        </div>

        <div class="box">
            <h2>Our Services</h2>
            <p>Web Design</p>
            <p>Web Development</p>
            <p>HTML & CSS Projects</p>
        </div>

        <button>Learn More</button>

    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
